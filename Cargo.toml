[workspace]
resolver = "2"
members = [
    "crates/win_platform",
    "crates/windeck",
]

[workspace.package]
edition = "2024"
version = "0.2.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2"
gpui = "0.2.2"
image = "0.25"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
raw-window-handle = "0.6"
serde_json = "1"
smallvec = "1"
windows = "0.61"
windows-core = "0.61"
windows-registry = "0.5"
