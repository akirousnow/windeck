[workspace]
resolver = "2"
members = [
    "crates/win_platform",
    "crates/probe_a",
    "crates/probe_b",
    "crates/windeck",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2"
gpui = "0.2.2"
image = "0.25"
raw-window-handle = "0.6"
smallvec = "1"
windows = "0.61"
windows-core = "0.61"
windows-registry = "0.5"
